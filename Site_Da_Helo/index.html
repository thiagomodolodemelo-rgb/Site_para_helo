            padding: 18px 24px;
            margin-bottom: 14px;
            background-color: #E6AA68;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(230, 170, 104, 0.3);
        }
        .btn:hover {
            background-color: #d99550;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(230, 170, 104, 0.4);
        }
        .btn-icon {

        /* RODAPÉ */
